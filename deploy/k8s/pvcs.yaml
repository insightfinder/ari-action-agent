apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ari-oncall-agent-task-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ari-oncall-agent-repo-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ari-oncall-agent-build-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
