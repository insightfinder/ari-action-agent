apiVersion: apps/v1
kind: Deployment
metadata:
  name: ari-oncall-agent-api
  labels:
    app: ari-oncall-agent
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ari-oncall-agent
      component: api
  template:
    metadata:
      labels:
        app: ari-oncall-agent
        component: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: docker.io/insightfinderinc/ari-agent-api:main
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: AGENT_KIND
              value: oncall
            - name: TASK_STORE_ROOT
              value: /var/lib/ari-agent/tasks
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ari-oncall-agent-env
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          volumeMounts:
            - name: task-store
              mountPath: /var/lib/ari-agent/tasks
      volumes:
        - name: task-store
          persistentVolumeClaim:
            claimName: ari-oncall-agent-task-store
---
apiVersion: v1
kind: Service
metadata:
  name: ari-oncall-agent-api
spec:
  selector:
    app: ari-oncall-agent
    component: api
  ports:
    - port: 80
      targetPort: 8000
