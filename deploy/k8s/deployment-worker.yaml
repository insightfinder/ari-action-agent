apiVersion: apps/v1
kind: Deployment
metadata:
  name: ari-oncall-agent-worker
  labels:
    app: ari-oncall-agent
    component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ari-oncall-agent
      component: worker
  template:
    metadata:
      labels:
        app: ari-oncall-agent
        component: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: docker.io/insightfinderinc/ari-oncall-agent-worker:main
          env:
            - name: AGENT_KIND
              value: oncall
            - name: SANDBOX_ROOT
              value: /var/lib/ari-agent/sandbox
            - name: REPO_CACHE_ROOT
              value: /var/lib/ari-agent/repo-cache
            - name: BUILD_CACHE_ROOT
              value: /var/lib/ari-agent/build-cache
            - name: MAX_CONCURRENT_ACTIVITIES
              value: "1"
          envFrom:
            - secretRef:
                name: ari-oncall-agent-env
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2000m, memory: 6Gi }
          volumeMounts:
            - name: sandbox
              mountPath: /var/lib/ari-agent/sandbox
            - name: repo-cache
              mountPath: /var/lib/ari-agent/repo-cache
            - name: build-cache
              mountPath: /var/lib/ari-agent/build-cache
      volumes:
        - name: sandbox
          emptyDir: {}
        - name: repo-cache
          persistentVolumeClaim:
            claimName: ari-oncall-agent-repo-cache
        - name: build-cache
          persistentVolumeClaim:
            claimName: ari-oncall-agent-build-cache
