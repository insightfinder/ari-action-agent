# RBAC for the `k8s` agent kind's worker (reference; the Helm chart should
# render the same rules). Every resource and verb is enumerated — no
# wildcards — and the agent can never:
#   - read Secrets (not listed at all),
#   - exec/attach/port-forward into pods,
#   - create or delete anything,
#   - touch RBAC (so it cannot widen its own authority).
# Writes are cluster-wide by decision (II-25173); human approval of every
# change and the agent's in-code bounds are the guardrails on top of this.
#
# Only the worker uses this ServiceAccount (automountServiceAccountToken:
# true). The API Deployment never talks to the cluster and keeps
# automountServiceAccountToken: false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ari-k8s-agent
  namespace: ari-k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ari-k8s-agent
rules:
  # ---- read
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: [gitrepositories, ocirepositories, buckets, helmrepositories]
    verbs: [get, list]
  # ---- write (patch only; the scale subresource for replica changes)
  - apiGroups: ["apps"]
    resources: [deployments/scale, deployments]
    verbs: [patch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [patch]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ari-k8s-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ari-k8s-agent
subjects:
  - kind: ServiceAccount
    name: ari-k8s-agent
    namespace: ari-k8s-agent
---
# Cluster Autoscaler's status, and nothing else in kube-system's ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ari-k8s-agent-ca-status
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ari-k8s-agent-ca-status
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ari-k8s-agent-ca-status
subjects:
  - kind: ServiceAccount
    name: ari-k8s-agent
    namespace: ari-k8s-agent
