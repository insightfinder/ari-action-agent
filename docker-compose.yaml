# Local dev only. Temporal itself is NOT started here — it's hosted
# externally; point TEMPORAL_HOST in .env at it (or at host.docker.internal
# if you're running a local Temporal dev server for testing).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.oncall
    env_file: .env
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      SANDBOX_ROOT: /var/lib/ari-agent/sandbox
      REPO_CACHE_ROOT: /var/lib/ari-agent/repo-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./skills:/app/skills
      - sandbox:/var/lib/ari-agent/sandbox
      - repo-cache:/var/lib/ari-agent/repo-cache

volumes:
  sandbox:
  repo-cache:
