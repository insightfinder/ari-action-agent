name: Build and Push Docker Images for ARI Agents

on:
  push:
    branches:
      - main
      - staging
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # One shared API image (Dockerfile.api — agent-kind-agnostic, see
      # docs/design.md §7) plus one worker image per agent kind this
      # branch carries. These names must match the Helm chart's own
      # ariOncallAgent.api.image / .worker.image repository values
      # exactly (charts/oncallari/values.yaml) — update both together if
      # either changes. The Jenkins agent kind lives on its own
      # `jenkins-agent` branch and builds its worker image from there.
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image: docker.io/insightfinderinc/ari-agent-api
          - dockerfile: Dockerfile.oncall
            image: docker.io/insightfinderinc/ari-oncall-agent-worker
          - dockerfile: Dockerfile.k8s
            image: docker.io/insightfinderinc/ari-k8s-agent-worker
          - dockerfile: Dockerfile.chat-gateway
            image: docker.io/insightfinderinc/ari-chat-gateway
      fail-fast: false
    env:
      IMAGE_NAME: ${{ matrix.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Generate timestamp tag
        id: timestamp
        run: echo "TAG=$(date +'%y%m%d%H%M')-${{ steps.branch.outputs.BRANCH }}" >> $GITHUB_OUTPUT

      - name: Print generated tag
        run: echo "Generated Docker tag for ${{ matrix.image }} - ${{ steps.timestamp.outputs.TAG }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.timestamp.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:${{ steps.branch.outputs.BRANCH }}
