[project]
name = "ari-oncall-agent"
version = "0.1.0"
description = "Standalone A2A on-call agent: analyzes an incident/prompt against a repo and opens a fix PR."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "temporalio>=1.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "openai>=3.14",
    "anthropic>=1.6",
    "a2a-sdk[fastapi]>=1.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ari_agent"]
