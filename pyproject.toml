[project]
name = "ari-oncall-agent"
version = "0.1.0"
description = "Standalone A2A on-call agent: analyzes an incident/prompt against a repo and opens a fix PR."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "temporalio>=1.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "openai>=3.14",
    "anthropic>=1.6",
    "a2a-sdk[fastapi]>=1.1",
    "cryptography>=42",
    "opentelemetry-api>=1.37",
    "opentelemetry-sdk>=1.37",
    "opentelemetry-exporter-otlp-proto-grpc>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The k8s kind's tests skip without it; a dev install runs them.
    "kubernetes>=37,<38",
]
# The k8s kind's worker only (Dockerfile.k8s). The shared API image and the
# oncall worker never import it, so they install without it.
k8s = [
    "kubernetes>=37,<38",
]
cli = [
    "typer>=0.12",
    "rich>=13",
    "prompt_toolkit>=3.0.40",
    "questionary>=2.0",
]
slack = [
    "slack_bolt>=1.21",
    "aiohttp>=3.9",
]
teams = [
    "microsoft-agents-hosting-aiohttp>=1.8,<2",
    "microsoft-agents-authentication-msal>=1.8,<2",
    "aiohttp>=3.9",
]

[project.scripts]
ari = "ari_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/ari_oncall_agent", "src/k8s_agent", "src/api", "src/chat_gateway", "src/ari_cli", "src/coordinator"]
