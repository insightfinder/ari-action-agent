# Declarative tool registry for the Jenkins agent kind — see
# configs/oncall/tools.yaml for the sibling registry this mirrors.
#
# Every real Jenkins operation (list/inspect jobs and builds, read logs,
# trigger a build) goes through opencode + the target Jenkins's own MCP
# server (https://plugins.jenkins.io/mcp-server/), configured per-request
# by opencode_config — not a bespoke Jenkins REST client here. The one
# exception is jenkins_stop_build: a direct REST fallback, since the MCP
# plugin's documented tool list doesn't clearly include a stop/cancel
# tool (see tools/jenkins_rest.py).

tools:
  opencode_config:
    module: jenkins_agent.tools.opencode_cli
    function: write_config

  opencode:
    module: jenkins_agent.tools.opencode_cli
    function: run_opencode

  jenkins_stop_build:
    module: jenkins_agent.tools.jenkins_rest
    function: stop_build

  llm_complete:
    module: common.llm.client
    function: complete
