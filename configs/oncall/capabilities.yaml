# Declarative capability registry.
#
# The planner reads `description`/`tools` to decide which capabilities to use
# and in what order for a given prompt. The executor reads `module` to load
# the capability's `run(ctx) -> dict` function, and `retry`/`on_failure` to
# drive Temporal's per-step retry/looping behavior.
#
# Adding a capability = write the module + add an entry here. No engine
# code changes.
#
# generate_change/verify are backed by opencode, each through its own
# scoped opencode "agent" (ari-change/ari-verify — see tools/opencode_cli.py)
# with only the permissions that step actually needs. propose_pr and
# publish_pr are plain deterministic git/REST with no opencode at all:
# the opencode + GitHub MCP fallback the old single-step publish_pr kept
# was removed when the human-in-the-loop gate split it in two, because it
# drove commit/push/PR against the sandbox working tree and there is no
# working tree left after the task pauses for approval.
#
# There used to be a separate `analyze` capability (read-only investigation,
# its own opencode agent/session) that ran before generate_change — merged
# into generate_change: opencode's own agentic loop already investigates as
# needed within one turn before editing, so the split only ever cost a
# second opencode subprocess + LLM session start for every request that was
# always going to edit anyway. See generate_change.py's own docstring.

capabilities:
  clone_repo:
    module: ari_oncall_agent.capabilities.clone_repo
    description: >
      Get the target repository ready in an isolated, per-request sandbox
      workspace: ensure/refresh a shared local mirror cache for this repo
      (so repeated requests against the same repo don't each pay for a
      full fresh remote clone), then fast-clone the requested branch from
      that cache into this request's own working copy, and write that
      request's opencode.json (LLM key, GitHub MCP server + PAT, scoped
      agents). Accepts an optional `ref` param (branch to check out) when
      the prompt names one explicitly, e.g. "check the repo in dev
      branch" — otherwise falls back to the request's configured default,
      and if neither is set, to whatever branch the remote itself reports
      as its default (main/master/whatever it actually is, never assumed).
      Always the first step of any pipeline that touches a repo.
    tools: [repo_cache_and_clone, git_set_origin, opencode_config]
    retry:
      max_attempts: 3
      backoff_seconds: 5

  generate_change:
    module: ari_oncall_agent.capabilities.generate_change
    description: >
      Use opencode (agent: ari-change, can edit files) to investigate the
      repository as needed and make the requested code change — a bug fix,
      a new feature, a refactor, or a specific edit, whatever the request
      actually asks for — informed by a prior verify failure when looping
      back. Always the step that both localizes a root cause (for a bug/
      issue) and edits, in one pass — never run a separate read-only
      investigation step first, opencode already investigates as needed
      within this same call before editing. Diff and the list of changed
      files are captured via `git diff`/`git diff --name-only`, not
      trusted from opencode's own report of what it changed — publish_pr
      uses the file list to scope staging and avoid sweeping in scratch
      files a later step (e.g. verify) may have left behind.
    tools: [opencode, git_diff, git_changed_files, git_untracked_files, git_intent_to_add]
    retry:
      max_attempts: 2
      backoff_seconds: 10

  verify:
    module: ari_oncall_agent.capabilities.verify
    description: >
      Use opencode (agent: ari-verify, can run arbitrary build/lint/test
      commands but cannot edit files) to run the project's test suite
      against the generated change. Opt-in, NOT part of the default
      pipeline: only include this step when the request explicitly asks
      for tests/verification to be run (e.g. "verify it works", "run the
      tests", "make sure it builds") — omit it for an ordinary bug
      fix/feature/edit request. Building/testing an arbitrary target repo
      is the slowest, least predictable step in this pipeline (cold
      dependency downloads, unknown build tooling per repo), so it's a
      real cost only worth paying when explicitly asked for, not a
      default every request should pay.
    tools: [opencode]
    retry:
      max_attempts: 1
      backoff_seconds: 0
    # Shorter than workflow.py's 20-minute default on purpose. Confirmed
    # live (Temporal history, 2026-09-21): with no bound here, a
    # slow/hung build routinely ran past callers' own ~8-10 minute
    # patience timeout, which cancelled the activity out from under this
    # pipeline every single time — wasting that whole window before
    # falling back, on every real request in a 48h sample. Timing out
    # here first (well inside that window) makes the failure deterministic
    # and lets the on_failure loop below retry with a fresh attempt
    # instead of racing an external cancel. Paired with a persistent
    # build-tool dependency cache (settings.build_cache_root) so repeat
    # attempts against the same repo aren't paying a cold-dependency-
    # download tax every time either.
    timeout_seconds: 900
    on_failure:
      goto: generate_change
      max_attempts: 2
      # `continue`, not `fail_needs_human`: when every attempt is spent the
      # pipeline carries on to propose_pr with the verification recorded as
      # failed, so the change a person has to judge actually reaches them.
      # `fail_needs_human` skipped propose_pr and discarded the diff -- see
      # workflow.py's own comment on this branch for the runs that proved it.
      then: continue

  propose_pr:
    module: ari_oncall_agent.capabilities.propose_pr
    description: >
      Deterministically (no LLM/opencode involved — title, body, branch
      name and file list are already fully known by this point) stage,
      commit and push the change to a new branch, then put the pull
      request it is ready to open in front of a person and pause: the
      task ends in TASK_STATE_INPUT_REQUIRED carrying a `pending_action`
      artifact, and the pull request is opened only after the caller
      confirms it. Opt-out, part of the default pipeline whenever
      generate_change runs — see meta.py's default_step_policy, which
      appends this step automatically even if the planner's own step list
      omits it, unless the request explicitly asked not to open a PR.
      Accepts an optional `base_ref` param (the PR's target branch) when
      the prompt names one explicitly and it differs from the branch
      clone_repo checked out, e.g. "raise a PR against staging" while
      working from dev — otherwise defaults to the same branch clone_repo
      used. Always the last step of a plan.
    tools: [git_add, git_commit, git_push]
    retry:
      max_attempts: 3
      backoff_seconds: 5

  run_skill:
    module: ari_oncall_agent.capabilities.run_skill
    description: >
      Run one installed Agent Skill on its own, with no repository: an
      opencode agent (ari-skill) loads the skill's instructions and may run
      only that skill's own scripts and the commands its allowed-tools
      grants; it cannot edit files. The installed
      skills are listed with a name and a description in the request's
      "available_skills". Use this step, alone and without clone_repo, when
      one of those skills clearly fits the request and the request does not
      ask for a change to a repository. Params: `skill` (required, the exact
      name from "available_skills") and `instruction` (what to do with it,
      in the user's terms, e.g. the hosts, addresses or values the request
      names). Never use it for code changes: those go through clone_repo and
      generate_change, where the same skills are already available to the
      change agent.
    tools: [opencode_skill]
    retry:
      max_attempts: 1
      backoff_seconds: 0
    timeout_seconds: 600

  # `internal: true` — deliberately invisible to the planner. A pull
  # request is opened only through plan_task's confirmation bypass, from
  # a propose_pr proposal a person approved, so this must never appear in
  # the catalog the planner chooses from. meta.py's planner guidance says
  # so too; this is the structural half of that guarantee, and the half
  # that does not depend on a model reading its instructions. The bypass
  # resolves it by name via get_capability(), which (unlike catalog())
  # does not filter internal capabilities out.
  publish_pr:
    module: ari_oncall_agent.capabilities.publish_pr
    description: >
      Open the pull request for an already-approved, already-pushed
      proposal, via one idempotent GitHub REST call. Every field comes
      from the confirmed proposal rather than being recomputed, so what a
      person approved is exactly what gets opened. Needs no repo working
      tree, which is what lets it run in the separate workflow execution
      that resumes a paused task.
    tools: [github_create_pr]
    internal: true
    retry:
      max_attempts: 3
      backoff_seconds: 5

  # `internal: true` — never chosen by the planner (excluded from
  # catalog()), always run directly by orchestration/workflow.py after
  # whatever plan the planner picked finishes (or gives up). This is what
  # actually answers the user: a plain question gets a real answer, a full
  # pipeline run gets a synthesized summary instead of a templated
  # one-liner. See capabilities/respond.py.
  respond:
    module: common.respond
    description: >
      Write the final human-facing response — a direct answer when no
      repo work was needed, or a synthesis of what was found/changed/
      verified/published when it was.
    tools: [llm_complete]
    internal: true
    retry:
      max_attempts: 2
      backoff_seconds: 5
