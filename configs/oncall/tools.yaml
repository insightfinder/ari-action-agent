# Declarative tool registry — the concrete callables capabilities are
# allowed to invoke. A capability only gets the tools listed under it in
# capabilities.yaml; this file just resolves a tool name to an implementation.
#
# Adding a tool = write the function + add an entry here + list its name
# under the relevant capability's `tools:` in capabilities.yaml.
#
# Note: publish_pr's primary path does NOT use opencode. Its git
# operations (add/commit/push) and its GitHub API call (open the PR) are
# plain, deterministic tools below — see capabilities/publish_pr.py for
# why: everything that step needs (title, body, branch, files) is already
# known by the time it runs, so there's nothing for an LLM/MCP round trip
# to decide. It still lists `opencode` among its tools for its fallback
# path (opencode + the GitHub MCP server, same as this capability's
# original implementation), used only if the primary path fails.

tools:
  git_clone:
    module: ari_oncall_agent.tools.git_ops
    function: clone

  git_diff:
    module: ari_oncall_agent.tools.git_ops
    function: diff

  git_changed_files:
    module: ari_oncall_agent.tools.git_ops
    function: changed_files

  git_untracked_files:
    module: ari_oncall_agent.tools.git_ops
    function: untracked_files

  git_intent_to_add:
    module: ari_oncall_agent.tools.git_ops
    function: intent_to_add

  git_set_origin:
    module: ari_oncall_agent.tools.git_ops
    function: set_origin

  git_default_branch:
    module: ari_oncall_agent.tools.git_ops
    function: default_branch

  git_add:
    module: ari_oncall_agent.tools.git_ops
    function: add

  git_commit:
    module: ari_oncall_agent.tools.git_ops
    function: commit

  git_push:
    module: ari_oncall_agent.tools.git_ops
    function: push

  github_create_pr:
    module: ari_oncall_agent.tools.github_rest
    function: create_pull_request

  repo_cache:
    module: ari_oncall_agent.tools.repo_cache
    function: ensure_cache

  repo_cache_and_clone:
    module: ari_oncall_agent.tools.repo_cache
    function: ensure_cache_and_clone

  opencode_config:
    module: ari_oncall_agent.tools.opencode_cli
    function: write_config

  opencode:
    module: ari_oncall_agent.tools.opencode_cli
    function: run_opencode

  opencode_skill:
    module: ari_oncall_agent.tools.opencode_cli
    function: run_skill_agent

  llm_complete:
    module: common.llm.client
    function: complete
