# Tool registry for the `k8s` agent kind. Every read returns whitelisted
# views (src/k8s_agent/tools/views.py), never raw objects.

tools:
  llm_complete:
    module: common.llm.client
    function: complete

  # ---- reads
  list_deployments:
    module: k8s_agent.tools.read
    function: list_deployments

  list_workloads:       # {kind, namespace, name} of every Deployment, StatefulSet, DaemonSet and CronJob
    module: k8s_agent.tools.read
    function: list_workloads

  get_workload:         # one Deployment, StatefulSet, DaemonSet or CronJob as its view (changes: Deployments only)
    module: k8s_agent.tools.read
    function: get_workload

  list_deployment_views:
    module: k8s_agent.tools.read
    function: list_deployment_views

  get_deployment:
    module: k8s_agent.tools.read
    function: get_deployment

  list_pods:
    module: k8s_agent.tools.read
    function: list_pods

  list_pods_on_node:    # every pod bound to one node (field selector spec.nodeName)
    module: k8s_agent.tools.read
    function: list_pods_on_node

  get_node:             # one node as its view, or null when it no longer exists
    module: k8s_agent.tools.read
    function: get_node

  list_events:
    module: k8s_agent.tools.read
    function: list_events

  get_pod_log:
    module: k8s_agent.tools.read
    function: get_pod_log

  get_pod_metrics:
    module: k8s_agent.tools.read
    function: get_pod_metrics

  find_autoscaler:
    module: k8s_agent.tools.read
    function: find_autoscaler

  get_pod:
    module: k8s_agent.tools.read
    function: get_pod

  list_views:           # any catalog kind as whitelisted views; 403/404 raise typed errors (reported as gaps)
    module: k8s_agent.tools.read
    function: list_views

  namespace_names:
    module: k8s_agent.tools.read
    function: namespace_names

  get_resize_support:   # discovery (/api/v1 pods/resize) and /version, read live
    module: k8s_agent.tools.read
    function: get_resize_support

  list_nodes:
    module: k8s_agent.tools.read
    function: list_nodes

  get_ca_status:
    module: k8s_agent.tools.read
    function: get_ca_status

  list_pdbs:
    module: k8s_agent.tools.read
    function: list_pdbs

  get_pvcs:
    module: k8s_agent.tools.read
    function: get_pvcs

  get_flux_chain:
    module: k8s_agent.tools.read
    function: get_flux_chain

  wait_rollout:
    module: k8s_agent.tools.rollout
    function: wait_rollout

  wait_resize:
    module: k8s_agent.tools.rollout
    function: wait_resize

  wait_pod_replaced:    # a deleted pod: old uid gone, replacement ready and stable
    module: k8s_agent.tools.rollout
    function: wait_pod_replaced

  # ---- writes
  dry_run_patch:        # always dryRun=All — cannot change the cluster
    module: k8s_agent.tools.write
    function: dry_run_patch

  patch_workload:       # the real write (patch, or a pod delete); listed only on apply_approved_change
    module: k8s_agent.tools.write
    function: patch_workload
